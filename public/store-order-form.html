<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Petzo store-order form</title>
  </head>
  <body>
    <!--
      Standalone static form so Netlify Form Detection always finds it
      (SPA redirects / hidden forms sometimes fail to register).
    -->
    <form
      name="store-order"
      method="POST"
      action="/store-order-form.html"
      netlify
      data-netlify="true"
      netlify-honeypot="bot-field"
    >
      <input type="hidden" name="form-name" value="store-order" />
      <p style="display: none">
        <label>Don’t fill: <input name="bot-field" /></label>
      </p>
      <input name="orderId" />
      <input name="buyerEmail" />
      <input name="buyerName" />
      <input name="subject" />
      <input name="totalPrice" />
      <input name="paymentMethod" />
      <input name="city" />
      <textarea name="message"></textarea>
      <textarea name="buyerMessage"></textarea>
      <button type="submit">send</button>
    </form>
  </body>
</html>
